<!doctype html><meta charset="utf-8"><title>atlas CORS probe</title>
<script>
// Minimal stand-in for the frontend data module: same request options as the contract requires.
window.probe = async (base) => {
  const results = {};
  for (const [name, path] of [["meta", "/meta"], ["missing", "/contexts/missing"], ["invalid", "/search?q=%20"],
                              ["context", "/contexts/" + encodeURIComponent("ctx:alpha-loss")]]) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 5000);
    try {
      const r = await fetch(base + path, {headers: {Accept: "application/json"}, credentials: "omit", signal: controller.signal});
      const body = await r.json();
      results[name] = {ok: true, status: r.status, requestIdHeader: r.headers.get("X-Request-ID"),
                       code: body.error ? body.error.code : null, snapshot: body.snapshot_id, mode: body.data_mode ?? null};
    } catch (e) {
      results[name] = {ok: false, error: String(e)};
    } finally { clearTimeout(timer); }
  }
  return results;
};
</script>
