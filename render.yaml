# Render Blueprint for the public read-only API. Contains no credentials.
# Secrets marked `sync: false` are entered manually in the Render dashboard
# when the Blueprint is created (see README "Deploy to Render").
# Nothing here has been deployed by the coding agent; no plan purchase is implied.
services:
  - type: web
    name: atlas-api
    runtime: python
    plan: free            # free services sleep after idle time; decide explicitly before judging
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn atlas.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3     # the runtime the test suite was run on
      - key: ATLAS_DATA_MODE
        sync: false       # explicit: `real` for judging, `synthetic_fixture` only for interface tests
      - key: ATLAS_SNAPSHOT_ID
        sync: false       # full snap_<sha256> returned by `python -m atlas publish` (real mode)
      - key: ATLAS_DATABASE_URL
        sync: false       # read-only atlas_api login role, TLS (real mode only)
      - key: ATLAS_ALLOWED_ORIGINS
        sync: false       # JSON array of exact frontend origins, e.g. ["https://app.example"]
      - key: ATLAS_RATE_LIMIT_PER_MINUTE
        value: "120"
