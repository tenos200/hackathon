[project]
name = "atlas"
version = "0.1.0"
description = "Rare Disease Atlas backend: evidence pipeline, immutable snapshots and a read-only FastAPI service (contract 1.0.0)."
requires-python = ">=3.12,<3.13"
readme = "README.md"
# Exact pins live in requirements*.txt (API runtime vs offline pipeline vs development).

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
